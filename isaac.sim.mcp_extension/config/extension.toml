[package]
name = "isaac_sim_mcp_extension"
version = "0.3.0"
title = "Isaac Sim MCP Server"
description = "MCP server extension for Isaac Sim to enable communication with Claude and other AI assistants"
category = "Robotics"
keywords = ["mcp", "server", "socket", "simulation", "robotics"]

[dependencies]
# Isaac Sim 5.x/6.x replaced the omni.isaac.* extensions with isaacsim.*
"isaacsim.core.api" = {}
"isaacsim.core.prims" = {}
"isaacsim.core.utils" = {}
"isaacsim.storage.native" = {}
"isaacsim.robot.wheeled_robots" = {}
"omni.kit.uiapp" = {}
"omni.kit.pip_archive" = {}
"omni.physx" = {}



# Main python module this extension provides, it will be publicly available as "import isaac_sim_mcp_extension".
[[python.module]]
name = "isaac_sim_mcp_extension"



[python.pipapi]


[settings]
exts."isaac.sim.mcp_extension".server.port = 8766
exts."isaac.sim.mcp_extension".server.host = "localhost"
